\* TLC Small Configuration for aq broadcast protocol
\*
\* Reduced state space for quick checking:
\*   - 2 agents (not 3)
\*   - 2 broadcasts max (not 5)
\*   - 1 TTL value (not 3)
\*   - Clock range 0..10 (not 0..600)
\*   - 2 files (not 3)
\*
\* Use this for rapid iteration. Switch to aq.cfg for full verification.

CONSTANTS
    Agents      = {"a1", "a2"}
    MaxBroadcasts = 2
    TTLValues   = {5}
    MaxClock    = 10
    Files       = {"main.go", "auth.py"}
    Phases      = {"conjecture", "proof", "refutation", "refinement"}
    Conjectures = {"C-1", "C-2"}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoGhostAfterArchive
    UniqueIds
    NoBroadcastLoss
    ConflictDetectionCompleteness
    ConflictSeverityCorrectness

PROPERTIES
    TTLExpiry

CONSTRAINT
    StateConstraint
