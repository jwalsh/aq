\* TLC Model Checker Configuration for aq broadcast protocol
\*
\* Full configuration: 3 agents, 3 files, 3 conjectures, 3 TTL values.
\* This produces a large state space. For quick checks, use aq_small.cfg.

CONSTANTS
    Agents      = {"a1", "a2", "a3"}
    MaxBroadcasts = 5
    TTLValues   = {5, 60, 300}
    MaxClock    = 600
    Files       = {"main.go", "auth.py", "config.py"}
    Phases      = {"conjecture", "proof", "refutation", "refinement"}
    Conjectures = {"C-1", "C-2", "C-3"}
    Statuses    = {"prosecuting", "done", "blocked"}

SPECIFICATION Spec

\* Safety properties (must hold in every reachable state)
INVARIANTS
    TypeOK
    NoGhostAfterArchive
    UniqueIds
    NoBroadcastLoss
    ConflictDetectionCompleteness
    ConflictSeverityCorrectness
    DoneStatusClears

\* Liveness properties (must eventually hold)
PROPERTIES
    TTLExpiry

\* State space bound
CONSTRAINT
    StateConstraint
