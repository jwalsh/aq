[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aq"
version = "0.1.0"
description = "Ambient agent queue — broadcast and conflict detection for multi-agent development"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aq = "aq.cli:main"

[tool.mypy]
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/aq"]
